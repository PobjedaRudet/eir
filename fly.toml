app = "eir"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "php artisan migrate --force"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  PRIMARY_REGION = "fra"
  LOG_CHANNEL = "stderr"
  LOG_STACK = "single"
  CACHE_STORE = "database"
  SESSION_DRIVER = "database"
  QUEUE_CONNECTION = "database"
  RUN_MIGRATIONS = "false"
  DB_CONNECTION = "pgsql"
  DB_PORT = "5432"
  DB_SSLMODE = "require"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
