app = "eir"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_NAME = "EIR"
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_URL = "https://eir.fly.dev"
  PRIMARY_REGION = "fra"
  LOG_CHANNEL = "stderr"
  LOG_STACK = "single"
  CACHE_STORE = "database"
  SESSION_DRIVER = "database"
  QUEUE_CONNECTION = "database"
  RUN_MIGRATIONS = "true"
  RUN_SEEDERS = "true"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/data/database.sqlite"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
